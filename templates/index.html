<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHECK YO WEATHER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">

    <form action="/" method="POST" id="form-input" class="mb-5">
        <div class="form-group row mb-3 align-items-center">
            <label for="city" class="col-sm-2 col-form-label">Search a city:</label>
            <div class="col-sm-10">
                <input type="text" name="city" placeholder="Enter Your City" class="form-control" id="task">
            </div>
        </div>
        <div class="form-group row">
            <div class="col-sm-10 offset-sm-2">
                <button class="btn btn-success" id="submit-button">Submit</button>
            </div>
        </div>
    </form>
    
    {% if data %}
        {% if data.error %}
            <div class="alert alert-danger" role="alert">
                {{ data.message }}
            </div>
        {% elif data.main %}
            <div class="table-responsive">
                <table class="table table-sm table-striped table-hover table-bordered align-middle" style="--bs-border-color: #444;">
                    <thead>
                        <tr>
                            <th scope="col" style="width: 20%">City Name</th>
                            <th scope="col" style="width: 20%">Temperature</th>
                            <th scope="col" style="width: 20%">Humidity</th>
                            <th scope="col" style="width: 20%">Description</th>
                            <th scope="col" style="width: 20%">Icon</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>{{ data["name"] }}</td>
                            <td>{{ data["main"]["temp"] }} K</td>
                            <td>{{ data["main"]["humidity"] }}%</td>
                            <td>{{ data["weather"][0]["description"] }}</td>
                            <td><img src="https://openweathermap.org/img/wn/{{ data['weather'][0]['icon'] }}@2x.png" alt="weather icon"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        {% endif %}
    {% endif %}

</body>
</html>
